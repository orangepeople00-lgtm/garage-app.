<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Site Measure">
<title>Absolute Garage Builders — Site Measure</title>
<link rel="manifest" href="site-measure-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f3a;--navy2:#14233c;--gold:#c9a227;--gold2:#e8c547;--blue:#1e4a8c;
  --bg:#eef1f6;--panel:#fff;--ink:#172033;--muted:#6f7a8d;--line:#dfe4eb;
  --green:#15803d;--yellow:#b45309;--red:#b91c1c;--shadow:0 10px 28px rgba(15,23,42,.08);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden;max-width:100%}
img,canvas,svg{max-width:100%;height:auto}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
input,select,textarea{font-size:16px;border:1px solid #ccd5e1;border-radius:8px;padding:10px 12px;background:#fff;outline:none;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:#8cb1ff;box-shadow:0 0 0 3px #dbeafe}
textarea{min-height:88px;resize:vertical;line-height:1.4}
label.lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;font-weight:900;color:var(--muted);margin:0 0 5px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:grid;gap:10px;min-width:0}
.row-2{grid-template-columns:1fr 1fr}
.row-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.row-3{grid-template-columns:1fr 1fr}.row-3 .span3{grid-column:1/-1}}
.hidden{display:none !important}

.sample-banner{background:#fde68a;color:#78350f;padding:8px 14px 8px calc(14px + env(safe-area-inset-left,0px));font-size:13px;font-weight:700;line-height:1.35;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sample-banner button{background:transparent;border:0;color:#78350f;font-weight:900;min-height:32px;padding:0 6px}

header.app{background:var(--navy);color:#fff;padding:10px 16px calc(10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(10px,env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;box-shadow:0 2px 12px #0003}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.logo{width:42px;height:42px;flex:0 0 42px;border-radius:10px;background:linear-gradient(160deg,#0b1f3a,#1a3a66);color:var(--gold);border:2px solid var(--gold);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.04em}
.brand h1{margin:0;font-size:16px;line-height:1.2;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;color:#d6c27a;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:6px;flex-shrink:0}
.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;line-height:1.2}
.btn.primary{background:var(--blue);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.light{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.dark{background:#223451;color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid #4a5d78;color:#fff}
.btn.sm{padding:8px 10px;font-size:13px;min-height:40px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}

main{max-width:1100px;margin:0 auto;padding:12px 14px 96px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));min-width:0}
@media(min-width:900px){main{padding-bottom:28px}}

.jobbar{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;box-shadow:var(--shadow);margin-bottom:12px}
@media(max-width:640px){.jobbar{padding:8px 10px;margin-bottom:8px}.jobbar input{min-height:40px;padding:8px 10px}}
@media(max-width:640px){.sample-banner{font-size:12px;padding:6px 12px}}
.jobbar .row-2{align-items:end}

.modes{display:none;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.modes .mode{flex:1 1 110px;background:#fff;border:1.5px solid var(--line);color:var(--navy);border-radius:999px;padding:9px 10px;font-weight:800;font-size:13px;min-height:42px}
.modes .mode.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media(min-width:900px){.modes{display:flex}}

.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px;min-width:0}
.card h2{margin:0 0 8px;font-size:18px;color:var(--navy)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--navy)}
.muted{color:var(--muted)}
.small{font-size:12px;line-height:1.4}
.warn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}
.warn strong{font-weight:800}
.okbox{background:#ecfdf3;border:1px solid #bbf7d0;color:#14532d;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}
.rough{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.pill.rough{background:#fee2e2;color:var(--red);border:0;margin:0;padding:4px 8px}
.pill.ok{background:#dcfce7;color:var(--green)}
.pill.info{background:#eef4ff;color:var(--blue)}
.pill.gold{background:#fef3c7;color:#92400e}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;box-shadow:0 2px 10px #0f172a08;min-width:0}
.tile:hover{border-color:var(--gold)}
.tile b{font-size:14px;color:var(--navy);font-weight:800}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;min-height:40px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

.stage{position:relative;background:#0b1f3a;border-radius:12px;overflow:hidden;min-height:220px;touch-action:none;user-select:none}
.stage canvas{display:block;width:100%;height:auto;vertical-align:top}
.stage .hint{position:absolute;left:8px;right:8px;top:8px;background:#0b1f3acc;color:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;pointer-events:none;line-height:1.3}

.meas-list{display:flex;flex-direction:column;gap:8px}
.meas-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.meas-row .val{font-weight:900;color:var(--navy);font-size:16px;white-space:nowrap}
.meas-row .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.live-num{font-size:42px;font-weight:900;color:var(--navy);letter-spacing:-.03em;line-height:1.1;text-align:center}
.live-sub{text-align:center;margin-top:4px}
.walk-pose{display:flex;justify-content:center;gap:8px;margin:8px 0;flex-wrap:wrap}

.check-list{display:flex;flex-direction:column;gap:0}
.check-list .item{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check-list .item:last-child{border-bottom:0}
.check-list .dot{width:18px;height:18px;border-radius:50%;flex:0 0 18px;margin-top:1px;border:2px solid var(--line);background:#fff}
.check-list .item.done .dot{background:var(--green);border-color:var(--green)}
.check-list .item.done{color:var(--muted)}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:40;padding-bottom:var(--safe-b);box-shadow:0 -4px 16px #0f172a14}
.bottom-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:800;padding:8px 4px 6px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0}
.bottom-nav button.on{color:var(--navy)}
.bottom-nav .ico{font-size:18px;line-height:1}
@media(min-width:900px){.bottom-nav{display:none}}

.modalbg{position:fixed;inset:0;background:#0b1f3acc;z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,var(--safe-b))}
@media(min-width:700px){.modalbg{align-items:center}}
.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 50px #0005}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modalhead h3{margin:0;font-size:16px}
.modal .body{padding:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + var(--safe-b));background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;z-index:70;max-width:min(420px,calc(100% - 24px));text-align:center;box-shadow:var(--shadow)}
@media(min-width:900px){.toast{bottom:24px}}

#arOverlay{position:fixed;inset:0;z-index:80;pointer-events:none}
#arOverlay .bar{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;background:#0b1f3ae6;color:#fff;padding:12px 14px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:8px;align-items:center}
#arCanvas{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:79;background:#000}

.layout-stage{background:#f8fafc;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.layout-stage svg{display:block;width:100%;height:auto}

.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

@media print{
  .sample-banner,header.app .header-actions,.bottom-nav,.modes,.btn,.photo-tools,nav{display:none !important}
  main{padding:0}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="sample-banner" id="sampleBanner">
  <span>Sample — not linked from the dashboard yet. Walk readings are rough estimates, not for pricing.</span>
  <button type="button" onclick="document.getElementById('sampleBanner').classList.add('hidden')" aria-label="Dismiss">✕</button>
</div>
<header class="app">
  <div class="brand">
    <div class="logo">AGB</div>
    <div>
      <h1>Site Measure</h1>
      <p>Absolute Garage Builders · On-site</p>
    </div>
  </div>
  <div class="header-actions">
    <a class="btn ghost sm" href="index.html" id="dashLink">← Dashboard</a>
  </div>
</header>
<main>
  <div class="jobbar">
    <div class="row row-2">
      <div class="field"><label class="lbl" for="jobName">Customer / site</label><input id="jobName" placeholder="Name or address" autocomplete="off"></div>
      <div class="field"><label class="lbl" for="village">Village (optional)</label><input id="village" placeholder="e.g. Brookfield" autocomplete="off"></div>
    </div>
  </div>
  <nav class="modes" role="tablist" id="modeTabs"></nav>
  <div id="viewRoot"></div>
</main>
<nav class="bottom-nav" id="bottomNav" aria-label="Sections"></nav>
<div id="modalRoot"></div>
<div id="toast" class="toast hidden" role="status"></div>
<canvas id="arCanvas"></canvas>
<div id="arOverlay" class="hidden">
  <div class="bar">
    <div id="arReadout" style="font-size:28px;font-weight:900">Tap a start point</div>
    <div class="small" id="arHint" style="color:#d6c27a">AR measure — typically within a couple of inches on a clear surface. Confirm tight numbers with a tape.</div>
    <div class="btns" style="justify-content:center">
      <button type="button" class="btn light sm" id="arUndo">Undo</button>
      <button type="button" class="btn gold sm" id="arSave">Save</button>
      <button type="button" class="btn danger sm" id="arEnd">End AR</button>
    </div>
  </div>
</div>
<script src="site-measure-lib.js"></script>
<script src="site-measure-app.js"></script>
</body>
</html>
