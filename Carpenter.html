  <div class="door-row" id="doorRow">

      <input class="f" id="customer" style="left:18%;top:25.6%;width:36%;height:2.2%"/>
      <input class="f" id="phone" style="left:62%;top:25.6%;width:34%;height:2.2%"/>

      <input class="f" id="roofSheath" style="left:72%;top:80.6%;width:24%;height:2.2%"/>

<script>
const SB_URL='https://iomcekniylxfptswcxoi.supabase.co';
const SB_KEY='sb_publishable_G_ZAnQ_CoJjWsn8-HgduLw_IziPWEmn';
const ALLOWED=['randy','sam'];
const FIELDS=['collectLumber','collectCarpentry','jobDate','carpenter','rep','customer','phone','address','city','sizeW','sizeL','roof','pitch','ohDoors','wallHeight','rafters','wallCenters','crossties','eaves','doorJamb','winHung','winSlider','winOther','siding','sidingColor','corners','wallSheath','roofSheath','shingles','header','patioRoof','patioPosts','ceiling','notes','ohWall','ohPos','svcWall','svcPos'];
let sb=null, profile=null;

function $(id){return document.getElementById(id)}
function val(id){return String($(id)?.value||'').trim()}

function loadLocal(){
  try{
    const raw=localStorage.getItem('agb_carpenter_ticket');
    if(!raw) return;
    const o=JSON.parse(raw);
    FIELDS.forEach(id=>{ if(o[id]!=null && $(id)) $(id).value=o[id]; });
  }catch(e){}
}
function saveLocal(){
  const o={};
  FIELDS.forEach(id=>o[id]=$(id)?$(id).value:'');
  try{ localStorage.setItem('agb_carpenter_ticket', JSON.stringify(o)); }catch(e){}
}
function clearTicket(){
  if(!confirm('Clear this ticket?')) return;
  FIELDS.forEach(id=>{ if($(id) && id!=='notes') $(id).value=''; });
  if($('notes')) $('notes').value='INSTALL SILL PAN FOR SERVICE DOOR';
  saveLocal();
  $('planBox').style.display='none';
}

function doorSlot(pos){
  if(pos==='left') return {left:'10%', width:'28%'};
  if(pos==='right') return {left:'62%', width:'28%'};
  return {left:'32%', width:'36%'};
}
function wallView(name, wallKey){
  const ohWall=val('ohWall')||'front';
  const svcWall=val('svcWall')||'right';
  const oh=doorSlot(val('ohPos')||'center');
  const svc=doorSlot(val('svcPos')||'right');
  let html='<div class="view"><h3>'+name.toUpperCase()+' WALL</h3><div class="wall">';
  if(ohWall===wallKey){
    html+='<div class="oh" style="left:'+oh.left+';width:'+oh.width+'">OH '+(val('ohDoors')||'DOOR')+'</div>';
  }
  if(svcWall===wallKey){
    const left = svcWall===ohWall && (val('ohPos')||'center')===(val('svcPos')||'right')
      ? (val('svcPos')==='right'?'8%':'78%')
      : (svc.left);
    html+='<div class="svc" style="left:'+left+'">SVC</div>';
  }
  if(ohWall!==wallKey && svcWall!==wallKey){
    html+='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font:700 12px Arial">No doors this wall</div>';
  }
  html+='</div></div>';
  return html;
}
function makePlans(){
  const w=val('sizeW')||'__', l=val('sizeL')||'__';
  const roof=val('roof')||'Gable / Rev Gable / Hip';
  const pitch=val('pitch')||'4/12';
  const walls=val('wallHeight')||'8';
  const siding=[val('siding')||'D4 / Dutchlap / Other', val('sidingColor')?('color '+val('sidingColor')):''].filter(Boolean).join(' — ');
  const roofing=val('shingles')||'Architectural / 3-tab (see ticket)';
  const ohWall=val('ohWall')||'front';
  const svcWall=val('svcWall')||'right';
  const lines=[
    'ABSOLUTE GARAGE BUILDERS — CARPENTER BUILD PLAN',
    'Job: '+(val('customer')||'—')+'  |  '+(val('address')||'—')+'  |  '+(val('city')||'—'),
    'Date '+(val('jobDate')||'—')+'   Carpenter '+(val('carpenter')||'—')+'   Rep '+(val('rep')||'—'),
    '',
    'PITCH: '+pitch,
    'ROOF TYPE: '+roof,
    'ROOFING / SHINGLES: '+roofing,
    'SIDING: '+siding+(val('corners')?('   Corners: '+val('corners')):''),
    'WALL HEIGHT: '+walls+"'",
    'GARAGE SIZE: '+w+"' x "+l+"'",
    'OH DOOR: '+(val('ohDoors')||'see ticket')+' on the '+ohWall.toUpperCase()+' wall ('+(val('ohPos')||'center')+')',
    'SERVICE DOOR: 36x80 on the '+svcWall.toUpperCase()+' wall ('+(val('svcPos')||'right')+') — install sill pan',
    'RAFTERS: '+(val('rafters')||'2x6')+'   WALL CENTERS: '+(val('wallCenters')||'16" O.C.')+'   CROSSTIES: '+(val('crossties')||'2x6 48" O.C.'),
    'EAVES: '+(val('eaves')||'—')+'   DOOR JAMB: '+(val('doorJamb')||'—'),
    'SHEATHING — walls '+(val('wallSheath')||'—')+' / roof '+(val('roofSheath')||'—'),
    'HEADER: '+(val('header')||'2-2x12 w/ 1/2 flitch or 2 LVL'),
    'WINDOWS: SH '+(val('winHung')||'—')+'  Slider '+(val('winSlider')||'—')+'  Other '+(val('winOther')||'—'),
    'PATIO ROOF: '+(val('patioRoof')||'none')+'  Posts '+(val('patioPosts')||'—')+'  Ceiling '+(val('ceiling')||'—'),
    'NOTES: '+(val('notes')||'Install sill pan for service door.'),
    '',
    'BUILD SEQUENCE',
    '1. Snap layout '+w+"' x "+l+"'. Confirm OH opening on "+ohWall+" wall and service door on "+svcWall+" wall.",
    '2. Stand walls '+walls+"' on treated plates. Keep 1' minimum returns beside the OH door.",
    '3. Set '+(val('header')||'specified')+' header over the OH door. Service door gets a standard header + sill pan.',
    '4. Sheathe walls, set rafters at '+pitch+' '+roof+', crossties, then roof sheathing.',
    '5. Roof with '+roofing+'. Box eaves. Hang OH door on '+ohWall+'; hang service door on '+svcWall+'.',
    '6. Apply '+siding+' and corners. Do not run service door to grade — stop at slab/siding line.'
  ];
  $('planText').innerHTML =
    '<div class="kv">'+
      '<b>Pitch</b><span>'+pitch+'</span>'+
      '<b>Roof type</b><span>'+roof+'</span>'+
      '<b>Roofing</b><span>'+roofing+'</span>'+
      '<b>Siding</b><span>'+siding+'</span>'+
      '<b>OH door</b><span>'+(val('ohDoors')||'OH door')+' — '+ohWall+' wall</span>'+
      '<b>Service door</b><span>36x80 — '+svcWall+' wall</span>'+
    '</div>'+
    '<pre>'+lines.join('\n')+'</pre>'+
    '<div class="views">'+
      wallView('Front','front')+wallView('Back','back')+
      wallView('Left side','left')+wallView('Right side','right')+
    '</div>';
  document.body.classList.add('show-plan');
  $('planBox').style.display='block';
  $('planBox').scrollIntoView({behavior:'smooth',block:'start'});
}

document.addEventListener('input', e=>{
  if(e.target && (e.target.classList.contains('f'))) saveLocal();
});
document.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  if(e.target && e.target.id==='notes') return;
  if(e.target && e.target.classList.contains('f')){
    e.preventDefault();
    makePlans();
  }
});

async function afterAuth(user){
  let uname='';
  try{
    const {data:p}=await sb.from('staff_profiles').select('username,role').eq('id',user.id).maybeSingle();
    uname=String(p?.username||'').toLowerCase();
  }catch(e){}
  if(!uname) uname=String(user.email||'').split('@')[0].toLowerCase();
  profile={username:uname};
  const blob=[uname, user.email||''].join(' ').toLowerCase();
  if(!(ALLOWED.includes(uname) || /\b(randy|sam|samer)\b/.test(blob))){
    $('app').style.display='none';
    $('gate').style.display='block';
    $('gateMsg').textContent='Carpenter Ticket is on Randy and Sam’s accounts only.';
    return;
  }
  $('gate').style.display='none';
  $('app').style.display='block';
  $('who').textContent=uname;
  loadLocal();
}

async function boot(){
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user) return afterAuth(session.user);
  location.href='index.html';
}
boot();
</script>
